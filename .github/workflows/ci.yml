name: CI

on:
  pull_request:
    branches:
      - master
            
jobs:
  macos-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run macos tests
        run: xcodebuild clean build test -project EssentialFeed.xcodeproj -scheme "CI_macOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
  ios-tests:
    runs-on: ios-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ios tests
        run: xcodebuild clean build test -project EssentialFeed.xcodeproj -scheme "CI_iOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 17 Pro" ONLY_ACTIVE_ARCH=YES
